<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">To-Do List</h1>
        <form hx-post="/add" hx-target="#task-list" hx-swap="beforeend" hx-on="htmx:afterRequest: this.reset()" class="mb-4 flex gap-2">
            <input type="text" name="description" placeholder="Enter a new task" required
                   class="flex-1 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" class="bg-blue-500 text-white p-2 rounded hover:bg-blue-600">Add Task</button>
        </form>
        <ul id="task-list" class="space-y-2">
            {{range .}}
                {{template "task" .}}
            {{end}}
        </ul>
    </div>
</body>
</html>
