{{ define "task"}}
<li class="flex items-center gap-2 p-2 bg-gray-50 rounded {{if .Done}}text-gray-500 line-through{{end}}">
    <input type="checkbox" {{if .Done}}checked{{end}}
           hx-put="/toggle/{{.ID}}" hx-target="closest li" hx-swap="outerHTML" hx-include="this, previous input"
           class="h-5 w-5 text-blue-500">
    <span class="flex-1">{{.Description}}</span>
    <button hx-delete="/delete/{{.ID}}" 
            hx-target="closest li" 
            hx-swap="outerHTML" 
            class="text-red-500 hover:text-red-700 text-sm ml-2">
        Remove Task
    </button>
</li>
{{end}}
